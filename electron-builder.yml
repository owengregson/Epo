# electron-builder configuration for `npm run dist` (standalone packaging).
# App icons live in build/, all GENERATED from the canonical art in
# project/assets/epo_appicon.png by `node scripts/make-icons.mjs` (rerun it
# after replacing that png): icon.icns + icon.png are the macOS presentation
# (artwork padded to Apple's 824-in-1024 icon grid — full-bleed renders
# oversized in the Dock); icon-win.png is the full-bleed Windows source the
# .ico is derived from (win.icon below).
# (build/icon.svg is the superseded pre-2026-08-23 mark; not a source anymore.)
appId: com.owengregson.epo
productName: Epo

directories:
  output: release
  buildResources: build

# The esbuild output is self-contained except for native/external modules
# (better-sqlite3 stays external and is loaded from node_modules at runtime;
# @fortawesome fonts are already inlined into dist/renderer/index.css as data:
# URIs by esbuild, so they are not needed at runtime). electron-builder also
# packages the production "dependencies" from package.json automatically.
files:
  - dist/**
  - package.json

# Native module: better-sqlite3 cannot be loaded from inside the asar archive.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# electron-builder rebuilds native deps (better-sqlite3) against the target
# Electron ABI on its own; run `npm run rebuild:node` afterwards if you want
# to run Jest again in the same checkout (tests need the Node ABI).
npmRebuild: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: false
  # Unsigned build for now — code signing + notarization are a later step.
  # NOTE for the self-updater: while unsigned, macOS runs in notify-only
  # mode (docs/RELEASE.md §5) — Squirrel.Mac refuses unsigned updates.
  identity: null
  # Kebab-case, arch-suffixed: the defaults contain spaces, which GitHub
  # release-download URLs mangle. Pinned BEFORE the first release so asset
  # names (and the notes template that lists them) stay stable forever.
  artifactName: 'Epo-${version}-${arch}.${ext}'

win:
  # Full-bleed source (no Apple margin); electron-builder derives the .ico.
  icon: build/icon-win.png
  target:
    - nsis
    - portable

nsis:
  artifactName: 'Epo-Setup-${version}.${ext}'

portable:
  artifactName: 'Epo-${version}-portable.${ext}'

# The updater feed. This packs app-update.yml (provider + repo) into every
# build so electron-updater knows where to look; it does NOT auto-publish —
# the release workflow passes --publish never and owns the GitHub Release.
publish:
  provider: github
  owner: owengregson
  repo: Epo
