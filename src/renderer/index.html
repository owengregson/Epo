    <style id="boot-style">
      /* The splash (spec §12.8): it shows before any script runs and covers the app as it loads underneath.
         The intro animates .boot-backdrop, .boot-mark and .boot-under; BootGate writes the caption. */
      #boot { position: fixed; inset: 0; z-index: 10000; }
      #boot .boot-backdrop { position: absolute; inset: 0; background: #0d0d0f; }
      #boot .boot-mark {
        position: absolute; top: calc(46% - 36px); left: calc(50% - 36px);
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
      }
      #boot .boot-under {
        position: absolute; top: calc(46% + 60px); right: 0; left: 0;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
      }
      #boot .boot-shimmer {
        position: relative; width: 120px; height: 2px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08); border-radius: 1px;
      }
      #boot .boot-shimmer::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(238, 241, 244, 0.85), transparent);
        animation: boot-shimmer var(--breath) var(--ease-in-out) infinite;
      }
      #boot .boot-caption {
        height: 20px; margin: 0; font: 400 13px/20px "Inter", system-ui, sans-serif; color: #a8a8b0;
      }
      @keyframes boot-shimmer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-shimmer { background: rgba(255, 255, 255, 0.16); }
        #boot .boot-shimmer::after { display: none; }
      }
    </style>

        <p id="boot-caption" class="boot-caption"></p>
      </div>
