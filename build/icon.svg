<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Tile shape (macOS-native inset squircle) — clips every glass layer. -->
    <clipPath id="tile">
      <rect x="96" y="96" width="832" height="832" rx="186" ry="186"/>
    </clipPath>

    <!-- Dark liquid-glass body: deep, faintly cool graphite. -->
    <linearGradient id="glass" x1="140" y1="120" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282b33"/>
      <stop offset="46%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <!-- Top-left specular sheen (the glass catching light). -->
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Faint cool refraction glow in the lower-right (liquid depth). -->
    <radialGradient id="tint" cx="0.78" cy="0.86" r="0.7">
      <stop offset="0%" stop-color="#4b6488" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#4b6488" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom inner shade — glass thickness. -->
    <linearGradient id="depth" x1="0" y1="520" x2="0" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <!-- Top edge rim highlight. -->
    <linearGradient id="rim" x1="0" y1="96" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <!-- The Epo "e" silhouette (locked brand mark, viewBox 0..64). -->
    <mask id="e" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="7" y="7" width="50" height="50" rx="16" ry="16" fill="#fff"/>
      <rect x="15" y="15" width="34" height="13" rx="7" ry="7" fill="#000"/>
      <rect x="15" y="36" width="34" height="13" rx="7" ry="7" fill="#000"/>
      <rect x="43" y="36" width="21" height="10" fill="#000"/>
    </mask>
    <!-- Brushed-metal body + shadow + top-edge shine (treatment B). -->
    <linearGradient id="b" x1="0" y1="6" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f6fa"/><stop offset="18%" stop-color="#cdd1d8"/><stop offset="44%" stop-color="#eff2f6"/>
      <stop offset="57%" stop-color="#aeb2ba"/><stop offset="80%" stop-color="#d0d3d9"/><stop offset="100%" stop-color="#ebeef2"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="30" x2="0" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31343b" stop-opacity="0"/><stop offset="100%" stop-color="#212329" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="7" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===== Liquid-glass tile ===== -->
  <g clip-path="url(#tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#glass)"/>
    <ellipse cx="360" cy="250" rx="560" ry="430" fill="#ffffff" opacity="0.12" filter="url(#soft)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#tint)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#sheen)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#depth)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#rim)"/>
  </g>
  <!-- Crisp glass rim: dark outer + light inner. -->
  <rect x="96" y="96" width="832" height="832" rx="186" ry="186" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="2.5"/>
  <rect x="97.5" y="97.5" width="829" height="829" rx="185" ry="185" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- ===== Metallic "e", centered, 8% padding to the tile edges ===== -->
  <g transform="translate(64.717 64.717) scale(13.9776)">
    <g mask="url(#e)">
      <rect width="64" height="64" fill="url(#b)"/>
      <rect width="64" height="64" fill="url(#s)"/>
      <rect width="64" height="64" fill="url(#h)"/>
    </g>
  </g>
</svg>
