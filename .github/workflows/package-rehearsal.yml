# Weekly packaging rehearsal — the release pipeline, run on a clock instead of
# a tag, plus a real boot of the built app. Releases are rare; toolchain and
# runner images move weekly. Without this, packaging rot (an electron-builder
# breakage, a native-module ABI surprise, a runner image change) is discovered
# on tag day. With it, the same steps release.yml runs are proven green every
# Saturday, and the boot smoke catches the "it bundles but won't start" class
# (bad native rebuild, a main-process crash on startup) that no unit gate can.
name: package-rehearsal

on:
  schedule:
    - cron: '15 6 * * 6' # Saturdays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-rehearsal
  cancel-in-progress: true

jobs:
  # Mirrors release.yml's package job exactly (keep the two in sync) — same
  # runners, same electron-builder targets, same output layout.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac dmg zip --arm64 --x64
          - os: windows-latest
            targets: --win nsis portable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (esbuild bundle)
        run: npm run build

      # Signing is secrets-driven (docs/RELEASE.md §7): with no MAC_CSC_LINK
      # the mac build stays unsigned (ad-hoc signed by the afterPack hook);
      # once the Apple Developer secrets exist, this same step signs with the
      # Developer ID certificate and notarizes — no workflow edit needed.
      - name: Package with electron-builder
        shell: bash # pwsh mangles the dotted -c.directories flag on Windows
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "${MAC_CSC_LINK:-}" ]; then
            echo "Developer ID certificate present — signing and notarizing."
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            extra="-c.mac.notarize=true"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.targets }} --publish never -c.directories.output=release $extra

      - name: Keep the artifacts briefly for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.zip.blockmap
            release/*.exe.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 3

  boot-smoke:
    name: boot smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The shared smoke runner owns a temporary profile, blocks IG traffic,
      # observes 25 s of uptime, then quits and removes the profile.
      - name: Boot the app in an isolated offline profile
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          xvfb-run --auto-servernum node scripts/ci-boot-smoke.mjs

      - name: Attach the boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-log
          path: boot.log
          if-no-files-found: ignore
          retention-days: 3
