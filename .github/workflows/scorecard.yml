# OSSF Scorecard — supply-chain security posture analysis (branch protection,
# token permissions, dependency pinning, dangerous workflow patterns, …).
# Runs on pushes to main (the branch it scores) and weekly to pick up new
# checks; results land in Security → Code scanning, and publish_results
# feeds the public OpenSSF REST API / badge.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    # OpenSSF Scorecard analyzes public repositories; on a private repo it
    # can't read the repo ("not found") — skip cleanly until the repo is public.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish_results verifies the workflow identity via OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The SARIF rides along as an artifact for offline inspection.
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
