# The PR/branch validation pipeline. Every push and PR against main proves
# the same four gates a local dev runs before committing:
#
#   typecheck (tsc --noEmit) → lint (biome) → test (jest) → build (esbuild)
#
# The matrix runs Node 25.x on Linux — the line Epo is developed against.
# Epo itself ships inside Electron's bundled Node, but the toolchain (esbuild,
# jest, better-sqlite3's node build used by tests) must work on that line.
# fail-fast is off so a failure still reports every matrix leg's result.
#
# better-sqlite3 is a native module: `npm run rebuild:node` compiles it
# against the runner's Node before jest loads it. The step probes for the
# script first so the workflow keeps working if the script is ever renamed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One live run per ref; a superseded commit cancels its predecessor's run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['25.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 ships prebuilds for common Node ABIs, but tests must
      # load it against THIS runner's Node — rebuild when the script exists,
      # skip quietly when it does not.
      - name: Rebuild native modules (better-sqlite3)
        run: |
          if [ "$(npm pkg get scripts.rebuild:node)" != "{}" ]; then
            npm run rebuild:node
          else
            echo "No rebuild:node script — skipping native rebuild."
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run lint` is `biome ci src`: lint rules + formatter drift +
      # assists (import organizing) in one gate.
      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '## Coverage'
              echo '| Metric | % |'
              echo '|---|---|'
              for m in lines statements branches functions; do
                echo "| $m | $(jq -r ".total.$m.pct" coverage/coverage-summary.json) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
