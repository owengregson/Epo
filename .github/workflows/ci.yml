# The PR/branch validation pipeline. Every push and PR against main proves
# the same four gates a local dev runs before committing:
#
#   typecheck (tsc --noEmit) → lint (eslint) → test (jest) → build (esbuild)
#
# The matrix covers the two active Node LTS lines (20.x, 22.x) on Linux —
# Epo itself ships inside Electron's bundled Node, but the toolchain (esbuild,
# jest, better-sqlite3's node build used by tests) must work on both LTS
# lines contributors actually have installed. fail-fast is off so a failure
# on one Node line still reports the other's result.
#
# better-sqlite3 is a native module: `npm run rebuild:node` compiles it
# against the runner's Node before jest loads it. The step probes for the
# script first so the workflow keeps working if the script is ever renamed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One live run per ref; a superseded commit cancels its predecessor's run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 ships prebuilds for common Node ABIs, but tests must
      # load it against THIS runner's Node — rebuild when the script exists,
      # skip quietly when it does not.
      - name: Rebuild native modules (better-sqlite3)
        run: |
          if [ "$(npm pkg get scripts.rebuild:node)" != "{}" ]; then
            npm run rebuild:node
          else
            echo "No rebuild:node script — skipping native rebuild."
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
